name: release

# A release happens exactly when a version tag is pushed, and never otherwise. Merging to main never versions
# and never publishes. Versioning is a local act: apply the pending changesets with pnpm changeset:version,
# commit the result, tag it vX.Y.Z, and push the tag. The tag is the release.
on:
  push:
    tags: ['v*']

# Releases must not overlap: an in-flight run is queued rather than cancelled, so a second tag pushed
# mid-release is still published rather than lost.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for short-lived publish credentials. This is what removes the need
      # for a long-lived NPM_TOKEN.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The pnpm version is taken from the packageManager field in package.json, so it cannot drift from what
      # is used locally.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # registry-url is deliberately omitted. It makes setup-node write an .npmrc containing
          # _authToken=${NODE_AUTH_TOKEN}, and with no token set that placeholder breaks OIDC authentication.
          # The default registry is npmjs.org, so nothing is lost by leaving it out.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist is gitignored, so the package has to be built before anything is published. prepack covers the
      # same ground for a manual publish.
      - name: Build
        run: pnpm build

      # Checking out a tag is a detached HEAD, which pnpm's publish git checks refuse. Pushing the tag is
      # itself the deliberate human act those checks exist to confirm, so they add nothing here.
      - name: Publish
        run: pnpm publish --no-git-checks
