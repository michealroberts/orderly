name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run when a branch is pushed to again. Runs on main are
# exempt so every commit that lands keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # oxfmt is a native binary and its output does not vary by Node version, so
  # this runs once against the pinned development version rather than across
  # the typecheck matrix, which would only produce a duplicate result.
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  # oxlint is likewise a native binary, so it runs once for the same reason as
  # the format job. Type-aware rules are not enabled here; they need the
  # TypeScript compiler and arrive separately.
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Runs as a second step in this job rather than as a job of its own, so
      # the install is shared. It is kept separate from the step above so a
      # failure names which of the two passes caught the problem.
      - name: Lint (type-aware)
        run: pnpm lint:types

  typecheck:
    name: typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version rather than stopping at the first, so a
      # break on one Node line is not masked by the other.
      fail-fast: false
      matrix:
        # 24 is the current LTS and the floor declared in engines; 26 is the
        # release line pinned in .nvmrc for local development. Both are tested
        # so the engines range stays honest.
        node: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # pnpm is resolved from the packageManager field in package.json rather
      # than installed separately, so CI and local development cannot drift.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
