# This file carries pnpm settings only. There is deliberately no `packages`
# key: orderly is a single package, and declaring a workspace makes changesets
# treat the repository as a monorepo, which tags releases `@observerly/orderly@x`
# rather than `vx`. Adding one back silently changes the tag format.

# Pin every dependency to an exact version. Several tools in this toolchain are
# pre-1.0 (oxfmt, @cloudflare/vitest-pool-workers), where minor bumps can break.
saveExact: true

# Refuse to install on a Node version outside the `engines` range in package.json.
engineStrict: true

# Switch pnpm to the version named in the packageManager field rather than
# running whatever the contributor happens to have installed, so any recent pnpm
# on a host machine still resolves to the pinned version.
managePackageManagerVersions: true

# pnpm blocks dependency install scripts by default. Every entry below fetches
# a platform binary the tool cannot run without, rather than performing optional
# setup: workerd is the runtime the tests execute inside, esbuild is what
# @cloudflare/vitest-pool-workers bundles test modules with, and lefthook is the
# hook runner itself.
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
