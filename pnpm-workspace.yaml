packages:
  - '.'

# Pin every dependency to an exact version. Several tools in this toolchain are
# pre-1.0 (oxfmt, @cloudflare/vitest-pool-workers), where minor bumps can break.
saveExact: true

# Refuse to install on a Node version outside the `engines` range in package.json.
engineStrict: true

# pnpm blocks dependency install scripts by default. Both entries below are
# required rather than convenient: workerd's install script fetches the Workers
# runtime binary that tests execute inside, and esbuild's fetches the platform
# binary that @cloudflare/vitest-pool-workers bundles test modules with. Without
# these, the test suite cannot start at all.
allowBuilds:
  esbuild: true
  workerd: true
